<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IFnoted">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<title>IFnoted</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #1c1c1e; color: #eee; }
  header { position: sticky; top: 0; background: #2a2a2d; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
           display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #3a3a3d; z-index: 5; }
  h1 { font-size: 20px; margin: 0; color: #a3e635; flex: 1; }
  select, button, input { font: inherit; }
  #filter, #viewBtn { padding: 6px 10px; border-radius: 8px; border: 1px solid #444; background: #3a3a3d; color: #eee; font-size: 14px; }
  #content { padding-bottom: 100px; }

  /* mission rows: 3 lines */
  .row { padding: 10px 16px; border-left: 4px solid transparent; line-height: 1.35;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .row .src { font-weight: 600; }
  .row .dsc { color: #ddd; }
  .row .dt { color: #aaa; font-size: 14px; }
  .row.soon { border-left-color: #f59e0b; }
  .row.soon .dt { color: #fbbf24; font-weight: 600; }
  .row.done { opacity: .5; }
  .row.done .dsc { text-decoration: line-through; }

  /* blocks */
  #blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .block { border-radius: 14px; overflow: hidden; }
  .block.open { grid-column: 1 / -1; }
  .bhead { padding: 16px 14px; min-height: 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .bname { font-weight: 700; font-size: 17px; word-break: break-word; }
  .bmeta { font-size: 13px; opacity: .85; margin-top: 6px; }
  .bwarn { color: #fbbf24; font-weight: 600; }
  .bbody { display: none; }
  .block.open .bbody { display: block; }

  .empty { text-align: center; color: #888; margin-top: 80px; white-space: pre-line; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #2a2a2d; border-top: 1px solid #3a3a3d;
        padding: 8px 16px calc(env(safe-area-inset-bottom) + 8px); display: flex; justify-content: center; }
  #addBtn { background: #a3e635; color: #1c1c1e; font-weight: 600; border: 0; border-radius: 24px; padding: 10px 28px; font-size: 17px; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; align-items: flex-end; }
  #modal.open { display: flex; }
  form { background: #2a2a2d; width: 100%; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px);
         border-radius: 16px 16px 0 0; display: grid; gap: 10px; }
  form h2 { margin: 0; font-size: 18px; color: #a3e635; }
  label { font-size: 13px; color: #aaa; display: grid; gap: 4px; }
  input, select.f { padding: 10px; border: 1px solid #444; border-radius: 8px; font-size: 16px; width: 100%;
                    background: #1c1c1e; color: #eee; color-scheme: dark; }
  .btns { display: flex; gap: 10px; }
  .btns button { flex: 1; padding: 11px; border-radius: 10px; border: 0; font-size: 16px; }
  #cancel { background: #3a3a3d; color: #eee; } #save { background: #a3e635; color: #1c1c1e; font-weight: 600; }
  #orig { font-size: 13px; color: #999; }
</style>
</head>
<body>
<header>
  <h1>IFnoted</h1>
  <button id="viewBtn"></button>
  <select id="filter">
    <option value="">All</option>
    <option>New</option><option>Started</option><option>Completed</option><option>Deleted</option>
  </select>
</header>

<div id="content"></div>

<nav><button id="addBtn">＋ Add Mission</button></nav>

<div id="modal">
  <form id="form">
    <h2 id="title">New Mission</h2>
    <label>Source (max 20)
      <input id="source" maxlength="20" list="sources" autocomplete="off" required>
      <datalist id="sources"></datalist>
    </label>
    <label>Description (max 50)
      <input id="desc" maxlength="50" required>
    </label>
    <label>Date to complete
      <input id="date" type="date" required>
    </label>
    <label>Status
      <select id="status" class="f">
        <option>New</option><option>Started</option><option>Completed</option><option>Deleted</option>
      </select>
    </label>
    <div id="orig"></div>
    <div class="btns">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" id="save">Save</button>
    </div>
  </form>
</div>

<script>
const KEY = "ifnoted_missions", VIEW_KEY = "ifnoted_view";
let missions = JSON.parse(localStorage.getItem(KEY) || "[]");
let view = localStorage.getItem(VIEW_KEY) || "list";
let editingId = null;
const openBlocks = new Set();
const $ = id => document.getElementById(id);

const save = () => localStorage.setItem(KEY, JSON.stringify(missions));
const fmt = iso => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y.slice(2)}`; };
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const daysLeft = iso => Math.round((new Date(iso) - new Date(todayISO())) / 86400000);
const isSoon = m => (m.status === "New" || m.status === "Started") && daysLeft(m.date) < 7;
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const keyOf = s => s.trim().toLowerCase();

const GREYS = ["#242426", "#2d2d30", "#363639"];
function hueOf(str) {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

function missionEl(m, i, hue) {
  const el = document.createElement("div");
  el.className = "row" + (isSoon(m) ? " soon" : "") + (m.status === "Completed" || m.status === "Deleted" ? " done" : "");
  el.style.background = hue === null ? GREYS[i % 3] : `hsl(${hue} 30% ${18 + (i % 3) * 5}%)`;
  const was = m.date !== m.originalDate ? ` (was ${fmt(m.originalDate)})` : "";
  el.innerHTML = `<div class="src">${esc(m.source)}</div><div class="dsc">${esc(m.desc)}</div><div class="dt">${fmt(m.date)}${was}</div>`;
  attachLongPress(el, () => openForm(m));
  return el;
}

function render() {
  const f = $("filter").value;
  const items = missions.filter(m => !f || m.status === f).sort((a, b) => a.date.localeCompare(b.date));
  $("viewBtn").textContent = view === "list" ? "▦ Blocks" : "☰ List";
  const box = $("content");
  box.innerHTML = "";

  if (!items.length) {
    box.innerHTML = `<div class="empty">${missions.length ? "No missions match this filter." : "No missions yet.\nTap ＋ to add one."}</div>`;
  } else if (view === "list") {
    items.forEach((m, i) => box.appendChild(missionEl(m, i, null)));
  } else {
    const groups = new Map();
    items.forEach(m => {
      const k = keyOf(m.source);
      if (!groups.has(k)) groups.set(k, { name: m.source, list: [] });
      groups.get(k).list.push(m);
    });
    const grid = document.createElement("div");
    grid.id = "blocks";
    [...groups.entries()].forEach(([k, g]) => {   // already ordered by earliest due date
      const hue = hueOf(k);
      const soon = g.list.filter(isSoon).length;
      const b = document.createElement("div");
      b.className = "block" + (openBlocks.has(k) ? " open" : "");
      b.style.background = `hsl(${hue} 45% 30%)`;
      b.innerHTML = `<div class="bhead"><div class="bname">${esc(g.name)}</div>
        <div class="bmeta">${g.list.length} mission${g.list.length > 1 ? "s" : ""}${soon ? ` · <span class="bwarn">⚠ ${soon} soon</span>` : ""}</div></div>
        <div class="bbody"></div>`;
      const body = b.querySelector(".bbody");
      g.list.forEach((m, i) => body.appendChild(missionEl(m, i, hue)));
      b.querySelector(".bhead").onclick = () => {
        openBlocks.has(k) ? openBlocks.delete(k) : openBlocks.add(k);
        b.classList.toggle("open");
      };
      grid.appendChild(b);
    });
    box.appendChild(grid);
  }

  const n = missions.filter(isSoon).length;
  if (navigator.setAppBadge) { n ? navigator.setAppBadge(n).catch(() => {}) : navigator.clearAppBadge().catch(() => {}); }
}

function attachLongPress(el, cb) {
  let t;
  const clear = () => clearTimeout(t);
  el.addEventListener("pointerdown", () => { t = setTimeout(cb, 500); });
  ["pointerup", "pointerleave", "pointermove", "pointercancel"].forEach(e => el.addEventListener(e, clear));
  el.addEventListener("contextmenu", e => e.preventDefault());
}

function fillSources() {
  const seen = new Map();
  missions.forEach(m => { const k = keyOf(m.source); if (!seen.has(k)) seen.set(k, m.source); });
  $("sources").innerHTML = [...seen.values()].sort((a, b) => a.localeCompare(b))
    .map(s => `<option value="${esc(s)}"></option>`).join("");
}

function openForm(m) {
  editingId = m ? m.id : null;
  fillSources();
  $("title").textContent = m ? "Edit Mission" : "New Mission";
  $("source").value = m ? m.source : "";
  $("desc").value = m ? m.desc : "";
  $("date").value = m ? m.date : todayISO();
  $("status").value = m ? m.status : "New";
  updateOrig();
  $("modal").classList.add("open");
}
function updateOrig() {
  const m = missions.find(x => x.id === editingId);
  $("orig").textContent = m && $("date").value !== m.originalDate ? `Original date: ${fmt(m.originalDate)}` : "";
}

$("addBtn").onclick = () => {
  openForm(null);
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
};
$("cancel").onclick = () => $("modal").classList.remove("open");
$("date").onchange = updateOrig;
$("filter").onchange = render;
$("viewBtn").onclick = () => {
  view = view === "list" ? "blocks" : "list";
  localStorage.setItem(VIEW_KEY, view);
  render();
};

$("form").onsubmit = e => {
  e.preventDefault();
  const data = { source: $("source").value.trim(), desc: $("desc").value.trim(), date: $("date").value, status: $("status").value };
  if (editingId) {
    Object.assign(missions.find(x => x.id === editingId), data); // originalDate never touched
  } else {
    missions.push({ id: Date.now().toString(), ...data, originalDate: data.date });
  }
  save(); render();
  $("modal").classList.remove("open");
};

render();
</script>
</body>
</html>
